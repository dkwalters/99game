<!DOCTYPE html>
<html>
<head>
    <title>99 Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby-container">
        <h1>Game Lobby</h1>
        <div id="setup-screen">
            <input type="text" id="name-input" placeholder="Enter Name" maxlength="12">
            <button onclick="join()">Join</button>
        </div>
        <div id="lobby-screen" style="display:none">
            <ul id="player-list"></ul>
            <button id="start-btn" onclick="start()" disabled>Start Game</button>
        </div>
    </div>

    <div id="game-board" style="display:none">
        <div id="opponent-area"></div>
        <div id="table-center">
            <h1 id="total-display">Total: 0</h1>
            <div id="last-card"></div>
        </div>
        <div id="player-area">
            <h2 id="turn-indicator">Waiting...</h2>
            <div id="player-hand"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
